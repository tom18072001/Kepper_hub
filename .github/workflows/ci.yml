# Kiểm thử mỗi PR / mỗi lần đẩy lên main: unit test, kiểm migration khớp schema, kiểm lỗ hổng thư viện, e2e (Chromium) trên CSDL test.
# Chỉ dùng dữ liệu GIẢ (seed) — không có dữ liệu MTL thật trong CI.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: workhub, POSTGRES_PASSWORD: workhub, POSTGRES_DB: workhub_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workhub -d workhub_e2e" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://workhub:workhub@127.0.0.1:5432/workhub_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/server/package-lock.json }
      - name: Cài thư viện máy chủ
        working-directory: app/server
        run: npm ci && npx prisma generate
      - name: Unit test
        working-directory: app/server
        run: npm test
      - name: Migration khớp schema
        working-directory: app/server
        run: |
          createdb -h 127.0.0.1 -U workhub shadow_ci || true
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://workhub:workhub@127.0.0.1:5432/shadow_ci --exit-code
        env: { PGPASSWORD: workhub }
      - name: Lỗ hổng thư viện (mức cao trở lên)
        working-directory: app/server
        run: npm audit --omit=dev --audit-level=high
      - name: E2E
        working-directory: app/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: app/e2e/playwright-report, retention-days: 7 }
