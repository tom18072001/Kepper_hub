# Kepper Hub — chạy trên máy cá nhân / máy chủ nội bộ.
#   cp .env.example .env   (sửa mật khẩu, JWT_SECRET)
#   docker compose up -d --build                      # Postgres + app, tệp lưu trên volume
#   docker compose --profile full up -d --build       # thêm MinIO + bộ xem trước Word (LibreOffice)
# Mở http://localhost:4100 (APP_PORT) — mọi cổng chỉ bind 127.0.0.1. Cho người khác dùng: đặt sau reverse proxy có TLS (xem README).
name: kepper

services:
  postgres:
    image: postgres:16-alpine
    # Transaction treo không giữ khoá / kết nối mãi; truy vấn > 1 s ghi vào log để tìm điểm chậm.
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=300s", "-c", "log_min_duration_statement=1000", "-c", "log_line_prefix=%m [%p] %u@%d "]
    environment:
      POSTGRES_USER: workhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: workhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhub -d workhub"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kepper-app:${APP_VERSION:-0.2.0}   # đổi APP_VERSION khi nâng cấp để quay lại được bản cũ
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://workhub:${POSTGRES_PASSWORD}@postgres:5432/workhub?connection_limit=10&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET trong .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4100}
      TRUST_PROXY: ${TRUST_PROXY:-false}   # sau reverse proxy: 1 (một tầng) hoặc IP của proxy
      ACCESS_LOG_DIR: /data/logs          # nhật ký truy cập ≥ 12 tháng (giữ 400 ngày), ra thư mục LOG_PATH trên máy
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME:-admin}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD:?Đặt ROOT_ADMIN_PASSWORD trong .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      MINIO_BUCKET: workhub-attachments
      PREVIEW_URL: ${PREVIEW_URL:-}
      PREVIEW_TOKEN: ${PREVIEW_TOKEN:-}
      # Kepper: Viber bot (mặc định tắt — xem docs/data-protection-assessment.md)
      VIBER_ENABLED: ${VIBER_ENABLED:-0}
      VIBER_AUTH_TOKEN: ${VIBER_AUTH_TOKEN:-}
      VIBER_BOT_NAME: ${VIBER_BOT_NAME:-Kepper Hub}
    volumes:
      - uploads:/data/uploads
      - ${LOG_PATH:-./logs}:/data/logs
    ports:
      - "127.0.0.1:${APP_PORT:-4100}:4000"
    restart: unless-stopped
    stop_grace_period: 20s   # dừng êm: chờ request / job đang chạy (server.js)
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    networks: [default, preview-net]

  # Sao lưu hằng ngày: CSDL + tệp đính kèm vào thư mục ./backups trên máy (giữ BACKUP_KEEP_DAYS ngày).
  # Nên chép thêm ./backups sang ổ/máy khác (quy tắc 3-2-1). Khôi phục: xem README.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: kepper-backup:${APP_VERSION:-0.2.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: workhub
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: workhub
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      # Mã hoá: khoá công khai age (age-keygen tạo cặp khoá; khoá bí mật giữ ngoài máy chạy). Trống = không mã hoá.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # Bản ngoài máy: đặt BACKUP_COPY_PATH là ổ / thư mục mạng khác (vd. E:/kepper-backups) → tự chép bản đạt sang đó.
      BACKUP_COPY: ${BACKUP_COPY:-0}
      BACKUP_COPY_KEEP_DAYS: ${BACKUP_COPY_KEEP_DAYS:-90}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      TZ: ICT-7   # chuỗi POSIX (UTC+7), không cần gói tzdata trong image alpine
    volumes:
      - ./deploy:/deploy:ro
      - ${BACKUP_PATH:-./backups}:/backups
      - ${BACKUP_COPY_PATH:-./backups-copy}:/backups-copy
      - uploads:/data/uploads:ro
    entrypoint: ["sh", "/deploy/backup.sh"]
    restart: unless-stopped

  # Khôi phục (chạy tay): docker compose stop app
  #   docker compose --profile restore run --rm -e RESTORE_FROM=/backups/<thư-mục> restore
  #   Bản đã mã hoá: thêm  -v <thư-mục-chứa-khoá>:/key:ro -e AGE_IDENTITY=/key/kepper-backup.key
  #   Thử khôi phục mỗi quý vào một CSDL tạm (đặt PGDATABASE=workhub_restore_test) và ghi biên bản.
  restore:
    profiles: ["restore"]
    image: kepper-backup:${APP_VERSION:-0.2.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: workhub
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: workhub
      AGE_IDENTITY: ${AGE_IDENTITY:-}
    volumes:
      - ./deploy:/deploy:ro
      - ${BACKUP_PATH:-./backups}:/backups:ro
      - uploads:/data/uploads
    entrypoint: ["sh", "/deploy/restore.sh"]
    restart: "no"

  # ---- Tuỳ chọn (profile "full") ----
  minio:
    profiles: ["full"]
    # Kiểm tra tag còn tồn tại trên Docker Hub trước khi dùng; MinIO đã ngừng phát hành bản cộng đồng mới từ cuối 2025.
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-workhub-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-minio-password}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  office-preview:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.preview
    image: workhub-office-preview:0.2.0
    environment:
      PREVIEW_TOKEN: ${PREVIEW_TOKEN:-}
      PREVIEW_TIMEOUT_MS: 60000
      PREVIEW_MAX_QUEUE: 4
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    networks: [preview-net]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  miniodata:

networks:
  preview-net:
    internal: true
