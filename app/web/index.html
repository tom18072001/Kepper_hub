<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kepper Hub · Tiến độ dự án</title>
  <meta name="theme-color" content="#17324A">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/fonts/be-vietnam-pro.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/stats.css">
  <link rel="stylesheet" href="css/gantt.css">
  <link rel="stylesheet" href="css/register2.css">
  <link rel="stylesheet" href="css/filters.css">
  <link rel="stylesheet" href="css/lists.css">
  <link rel="stylesheet" href="css/kepper.css">
  <link rel="stylesheet" href="css/weekly.css">
  <link rel="stylesheet" href="css/playground.css">
  <link rel="stylesheet" href="css/shell.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Đăng nhập -->
  <section id="loginPage" class="auth-page hidden" aria-label="Đăng nhập">
    <form id="loginForm" class="auth-card" autocomplete="on">
      <div class="brand-mark" aria-hidden="true">K</div>
      <h1>Kepper Hub</h1>
      <p class="muted">Theo dõi tiến độ dự án theo Master Timeline</p>
      <label class="field">Tài khoản<input id="loginUser" name="username" autocomplete="username" required data-testid="login-username"></label>
      <label class="field">Mật khẩu<input id="loginPass" name="password" type="password" autocomplete="current-password" required data-testid="login-password"></label>
      <button class="btn btn-primary btn-block" type="submit" data-testid="login-submit">Đăng nhập</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </section>

  <!-- Đổi mật khẩu bắt buộc -->
  <section id="passwordPage" class="auth-page hidden" aria-label="Đổi mật khẩu">
    <form id="passwordForm" class="auth-card">
      <h1>Đổi mật khẩu</h1>
      <p class="muted">Tài khoản của bạn cần đổi mật khẩu trước khi tiếp tục.</p>
      <label class="field">Mật khẩu hiện tại<input id="pwCurrent" type="password" autocomplete="current-password" required data-testid="pw-current"></label>
      <label class="field">Mật khẩu mới<input id="pwNew" type="password" autocomplete="new-password" required minlength="6" data-testid="pw-new"></label>
      <label class="field">Nhập lại mật khẩu mới<input id="pwConfirm" type="password" autocomplete="new-password" required minlength="6" data-testid="pw-confirm"></label>
      <button class="btn btn-primary btn-block" type="submit" data-testid="pw-submit">Lưu mật khẩu</button>
      <button class="btn btn-ghost btn-block" type="button" id="pwLogout">Đăng xuất</button>
      <p id="pwError" class="error" role="alert"></p>
    </form>
  </section>

  <!-- Ứng dụng -->
  <div id="appShell" class="shell hidden">
    <header class="appbar">
      <button class="ab-btn" id="menuBtn" aria-controls="sidebar" aria-expanded="true" title="Thu gọn menu" data-testid="menu-toggle"><span data-icon="menu"></span></button>
      <a class="ab-brand" href="#/" aria-label="Kepper Hub — trang chủ"><span class="brand-mark sm" aria-hidden="true">K</span><span class="ab-name"><b>Kepper Hub</b><span id="orgName" class="hidden"></span></span></a>
      <div class="ab-pop">
        <button class="ab-apps" id="appsBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="appsPanel" data-testid="apps-open"><span data-icon="grid"></span><span class="t">Ứng dụng</span></button>
        <div class="launcher hidden" id="appsPanel" role="menu" aria-label="Ứng dụng"></div>
      </div>
      <button class="ab-search" id="paletteBtn" data-testid="palette-open"><span data-icon="search"></span><span class="lbl">Tìm dự án, trang, mã việc…</span><kbd>Ctrl K</kbd></button>
      <div class="ab-right">
        <button class="ab-btn kbd-btn" id="shortcutsBtn" title="Phím tắt (?)" aria-label="Phím tắt" data-testid="shortcuts-open"><kbd>?</kbd></button>
        <div class="notif">
          <button class="ab-btn" id="notifBtn" aria-label="Thông báo" data-testid="notif-btn"><span data-icon="bell"></span><span class="dot hidden" id="notifDot" data-testid="notif-count"></span></button>
          <div class="popover hidden" id="notifPanel" role="dialog" aria-label="Thông báo"></div>
        </div>
        <div class="ab-pop">
          <button class="ab-user" id="userBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="userPanel" data-testid="user-menu"><span class="avatar" id="meAvatar"></span><span class="who"></span><span data-icon="down"></span></button>
          <div class="popover user-pop hidden" id="userPanel" role="menu" aria-label="Tài khoản"></div>
        </div>
      </div>
    </header>
    <div class="frame">
      <aside class="sidebar" id="sidebar" aria-label="Điều hướng">
        <div id="sidebarNav" class="sb-scroll"></div>
      </aside>
      <div class="sb-scrim hidden" id="sbScrim"></div>
      <div class="main">
        <div class="crumbs" id="crumbs"></div>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>
  </div>

  <!-- Panel chi tiết công việc -->
  <div id="panelBackdrop" class="panel-backdrop hidden"></div>
  <aside id="itemPanel" class="item-panel hidden" role="dialog" aria-modal="true" aria-label="Chi tiết công việc" data-testid="item-panel"></aside>

  <!-- Modal + palette + toast -->
  <div id="modalRoot" class="modal-root hidden"><div class="modal" role="dialog" aria-modal="true" id="modal"></div></div>
  <div id="paletteRoot" class="modal-root hidden"><div class="palette" role="dialog" aria-label="Tìm nhanh">
    <input id="paletteInput" placeholder="Gõ để tìm dự án, trang hoặc mã việc (VD: KD-12)…" data-testid="palette-input">
    <div id="paletteList" class="palette-list"></div>
  </div></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
